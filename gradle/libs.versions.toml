[versions]
# BlueLib
bluelib = "2.3.8"

# Common
minecraft-range = "[1.21,)"
minecraft = "1.21.1"
parchment-minecraft = "1.21.1"
parchment = "2024.11.17"
neoform = "1.21.1-20240808.144430"
jei-api = "19.21.0.247"

# Fabric
fabric = "0.17.2"
fabric-range = "0.16"
fabric-api = "0.116.6+1.21.1"
fabric-api-range = "0.100.0+1.21"

# Neoforge
neoforge-loader-range = "[4,)"
neoforge-range = "[21.1.62,)"
neoforge = "21.1.209"

# Dependencies
mixin = "0.8.7"
mixinextras = "0.5.0"
mixinextras-range = "[0.3.5,)"
examplemod = "2.0.0"

# Plugins
plugin-github-release = "2.5.2"
plugin-moddevgradle = "2.0.110"
plugin-minotaur = "2.8.10"
plugin-curseforge-gradle = "1.1.26"
plugin-idea-ext = "1.3"
plugin-mixin = "0.7.+"
plugin-loom = "1.11-SNAPSHOT"
spotless = "7.2.1"
license = "0.16.1"

[libraries]

# Mixin
mixin = { group = "org.spongepowered", name = "mixin", version.ref = "mixin" }
mixinextras-common = { group = "io.github.llamalad7", name = "mixinextras-common", version.ref = "mixinextras" }

# Platform
neoforge = { group = "net.neoforged", name = "neoforge", version.ref = "neoforge" }
fabric = { group = "net.fabricmc", name = "fabric-loader", version.ref = "fabric" }
fabric-api = { group = "net.fabricmc.fabric-api", name = "fabric-api", version.ref = "fabric-api" }
minecraft = { group = "com.mojang", name = "minecraft", version.ref = "minecraft" }

# Common
jei-api = { group = "mezz.jei", name = "jei-1.21.1-common-api", version.ref = "jei-api" }

# Fabric
jei-fabric = { group = "mezz.jei", name = "jei-1.21.1-fabric", version.ref = "jei-api" }

# NeoForge
jei-neoforge = { group = "mezz.jei", name = "jei-1.21.1-neoforge", version.ref = "jei-api" }

# Testing
examplemod-common = { group = "software.bluelib", name = "1.21.1", version.ref = "examplemod" }
examplemod-fabric = { group = "software.bluelib", name = "1.21.1", version.ref = "examplemod" }
examplemod-neoforge = { group = "software.bluelib", name = "1.21.1", version.ref = "examplemod" }

[plugins]
# Publishing
github-release = { id = "com.github.breadmoirai.github-release", version.ref = "plugin-github-release" }
minotaur = { id = "com.modrinth.minotaur", version.ref = "plugin-minotaur" }
curseforgegradle = { id = "net.darkhax.curseforgegradle", version.ref = "plugin-curseforge-gradle" }

# Formatting
com-diffplug-spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
com-github-hierynomus-license = { id = "com.github.hierynomus.license", version.ref = "license" }

# Platform
moddevgradle = { id = "net.neoforged.moddev", version.ref = "plugin-moddevgradle" }
loom = { id = "fabric-loom", version.ref = "plugin-loom" }

# Misc
ideaext = { id = "org.jetbrains.gradle.plugin.idea-ext", version.ref = "plugin-idea-ext" }
mixin = { id = "org.spongepowered.mixin", version.ref = "plugin-mixin" }